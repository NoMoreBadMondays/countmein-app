
name: Validate PowerPoint Manifest

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Office add-in manifest
        run: npx --yes @microsoft/office-addin-manifest validate manifest.xml
