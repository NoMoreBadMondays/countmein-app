
name: Validate PowerPoint Manifest

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check XML syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout manifest.xml
          echo "XML syntax is valid"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Office add-in manifest
        run: npx --yes office-addin-manifest validate manifest.xml
